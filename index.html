<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wakzil Studio — Montage vidéo</title>
  <meta name="theme-color" content="#0b0d12" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: dark; --accent:#8b5cf6; }
    * { box-sizing:border-box }
    body { margin:0; background:#090b10; color:#f4f4f5; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,textarea,select { font:inherit }
    .glass { background:rgba(20,23,32,.82); border:1px solid rgba(255,255,255,.09); box-shadow:0 18px 60px rgba(0,0,0,.18); }
    .muted { color:#a1a1aa }
    .field { width:100%; background:#0c0e15; border:1px solid #303341; border-radius:12px; padding:11px 13px; color:#fff; outline:none; }
    .field:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); }
    .btn { border:1px solid #343744; border-radius:12px; padding:10px 14px; font-weight:650; transition:.15s; cursor:pointer; }
    .btn:hover { transform:translateY(-1px); filter:brightness(1.08); }
    .btn-primary { background:var(--accent); color:white; border-color:transparent; }
    .btn-quiet { background:#171923; color:#f4f4f5; }
    .btn-danger { background:#3b171d; border-color:#6b2732; color:#fecdd3; }
    .navlink { padding:9px 12px; border-radius:10px; color:#b8bac6; white-space:nowrap; }
    .navlink.active,.navlink:hover { background:#222433; color:#fff; }
    .pill { border-radius:999px; padding:4px 9px; font-size:12px; border:1px solid #393b49; background:#1a1c27; }
    .hero-grid { background-image:radial-gradient(ellipse at 75% 20%,color-mix(in srgb,var(--accent) 25%,transparent),transparent 42%),linear-gradient(135deg,#121522,#090b10 70%); }
    .line-clamp-3 { display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden; }
    .calendar-cell { min-height:88px; border:1px solid #2c2e3a; border-radius:10px; padding:7px; background:#10121a; }
    .calendar-cell.today { border-color:var(--accent); }
    .calendar-cell.other { opacity:.4; }
    @media(max-width:640px){ .calendar-cell{min-height:68px;padding:5px} .navlink{padding:8px 9px;font-size:13px} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const {useState,useEffect,useMemo} = React;

    // 1) Remplace ces deux valeurs par celles de Supabase > Project Settings > API.
    // Utilise uniquement la clé publishable/anon côté navigateur, jamais la service_role.
    const SUPABASE_URL = "https://nhybunfifvomilevobst.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TeSV8NnuxNz1XjxutbD1bQ_NJZ5JKe4";

    const supabaseReady = SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("COLLE_ICI") &&
      SUPABASE_KEY && !SUPABASE_KEY.includes("COLLE_ICI");
    const supabase = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const money = value => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(value)||0);
    const niceDate = value => value ? new Date(value).toLocaleString("fr-FR",{dateStyle:"medium",timeStyle:"short"}) : "Non définie";
    const isoDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const safeText = value => String(value ?? "").trim();

    function App(){
      const [session,setSession] = useState(null);
      const [profile,setProfile] = useState(null);
      const [page,setPage] = useState("accueil");
      const [loading,setLoading] = useState(true);
      const [notice,setNotice] = useState("");
      const [busy,setBusy] = useState(false);
      const [authMode,setAuthMode] = useState("login");
      const [authForm,setAuthForm] = useState({email:"",password:"",name:""});
      const [settings,setSettings] = useState({theme_color:"#8b5cf6",paypal_link:"",base_price:40,rush_price:20,minia_price:15,sous_titres_price:10,rush_delivery_time:"48 heures",portfolio_description:"Du montage gaming rythmé aux formats courts, chaque vidéo est pensée pour capter l’attention et garder le meilleur du contenu."});
      const [portfolio,setPortfolio] = useState([]);
      const [tickets,setTickets] = useState([]);
      const [bookings,setBookings] = useState([]);
      const [activeTicket,setActiveTicket] = useState(null);
      const [messages,setMessages] = useState([]);
      const [messageText,setMessageText] = useState("");
      const [month,setMonth] = useState(new Date());
      const [order,setOrder] = useState({title:"",contact:"",brief:"",source_link:"",style:"",rush:false,scheduled_date:"",scheduled_time:""});
      const [newVideo,setNewVideo] = useState({title:"",category:"Gaming",video_url:"",thumbnail_url:"",price_base:""});
      const [settingsForm,setSettingsForm] = useState(null);

      const role = profile?.role || "client";
      const isTeam = role === "admin" || role === "monteur";
      const isAdmin = role === "admin";

      useEffect(()=>{
        document.documentElement.style.setProperty("--accent",settings.theme_color || "#8b5cf6");
      },[settings.theme_color]);

      useEffect(()=>{
        if(!supabase){setLoading(false);return;}
        let alive = true;
        supabase.auth.getSession().then(async ({data})=>{
          if(!alive)return;
          setSession(data.session);
          if(data.session) await loadAll(data.session.user);
          else setLoading(false);
        });
        const {data:{subscription}} = supabase.auth.onAuthStateChange(async (_event,nextSession)=>{
          if(!alive)return;
          setSession(nextSession);
          if(nextSession) await loadAll(nextSession.user);
          else {setProfile(null);setTickets([]);setBookings([]);setLoading(false);}
        });
        return ()=>{alive=false;subscription.unsubscribe();};
      },[]);

      async function loadAll(user){
        setLoading(true);
        try{
          const {data:prof,error:profErr}=await supabase.from("profiles").select("*").eq("id",user.id).maybeSingle();
          if(profErr) throw profErr;
          let actualProfile=prof;
          if(!actualProfile){
            const name=user.user_metadata?.display_name || user.user_metadata?.full_name || user.email?.split("@")[0] || "Client";
            const {data:created,error:createErr}=await supabase.from("profiles").insert({id:user.id,role:"client",display_name:name}).select("*").single();
            if(createErr) {
              // Ne bloque pas l'accès si la création automatique est empêchée par les règles RLS.
              actualProfile={id:user.id,role:"client",display_name:name};
            } else actualProfile=created;
          }
          setProfile(actualProfile);
          const [sRes,pRes,tRes,bRes]=await Promise.all([
            supabase.from("settings").select("*").eq("id",1).maybeSingle(),
            supabase.from("portfolio").select("*").order("created_at",{ascending:false}),
            supabase.from("tickets").select("*").order("created_at",{ascending:false}),
            supabase.from("video_bookings").select("*").order("scheduled_at",{ascending:true})
          ]);
          if(sRes.data){setSettings(prev=>({...prev,...sRes.data}));setSettingsForm({...settings,...sRes.data});}
          if(pRes.data)setPortfolio(pRes.data);
          if(tRes.data)setTickets(tRes.data);
          if(bRes.data)setBookings(bRes.data);
          if(tRes.error) console.warn("Tickets:",tRes.error.message);
          if(bRes.error) console.warn("Réservations:",bRes.error.message);
        }catch(err){setNotice("Chargement : "+(err.message||"une erreur est survenue"));}
        finally{setLoading(false);}
      }

      async function refreshTickets(){
        if(!supabase)return;
        const {data,error}=await supabase.from("tickets").select("*").order("created_at",{ascending:false});
        if(!error&&data)setTickets(data);
      }
      async function refreshBookings(){
        if(!supabase)return;
        const {data,error}=await supabase.from("video_bookings").select("*").order("scheduled_at",{ascending:true});
        if(!error&&data)setBookings(data);
      }
      async function signIn(e){
        e.preventDefault();setBusy(true);setNotice("");
        try{
          if(!supabase){setNotice("Ajoute d’abord l’URL et la clé Supabase dans le fichier.");return;}
          if(authMode==="signup"){
            const {data,error}=await supabase.auth.signUp({email:authForm.email,password:authForm.password,options:{data:{display_name:authForm.name}}});
            if(error)throw error;
            if(data.session){setNotice("Compte créé !");}
            else setNotice("Compte créé. Vérifie tes e-mails si la confirmation est activée, puis connecte-toi.");
          }else{
            const {error}=await supabase.auth.signInWithPassword({email:authForm.email,password:authForm.password});
            if(error)throw error;
          }
        }catch(err){setNotice(err.message||"Connexion impossible.");}
        finally{setBusy(false);}
      }
      async function logout(){await supabase?.auth.signOut();setSession(null);setProfile(null);setPage("accueil");}

      async function createOrder(e){
        e.preventDefault();
        if(!session){setPage("compte");setNotice("Connecte-toi pour envoyer une demande.");return;}
        setBusy(true);setNotice("");
        try{
          const chosenStyle=order.style ? `Style : ${order.style}\n` : "";
          const brief=[chosenStyle,order.brief].filter(Boolean).join("\n");
          const price=(Number(settings.base_price)||0)+(order.rush?(Number(settings.rush_price)||0):0);
          const payload={
            title:safeText(order.title),
            price,
            client_id:session.user.id,
            client_name:profile?.display_name || session.user.email,
            contact:safeText(order.contact),
            brief,
            rush:!!order.rush,
            rush_delivery_time:order.rush?(settings.rush_delivery_time||"48 heures"):null,
            source_link:safeText(order.source_link),
            selected_style_id:null,
            status:"En attente"
          };
          const {data,error}=await supabase.from("tickets").insert(payload).select("*").single();
          if(error)throw error;
          if(order.scheduled_date && order.scheduled_time){
            const scheduledAt=new Date(`${order.scheduled_date}T${order.scheduled_time}`).toISOString();
            const bookingPayload={client_id:session.user.id,client_name:profile?.display_name||session.user.email,title:order.title,scheduled_at:scheduledAt,notes:brief,status:"À planifier",ticket_id:String(data.id)};
            const {error:bookingError}=await supabase.from("video_bookings").insert(bookingPayload);
            if(bookingError) setNotice("Demande créée, mais réservation non enregistrée : "+bookingError.message);
          }
          setNotice(prev=>prev||"Demande envoyée avec succès !");
          setOrder({title:"",contact:"",brief:"",source_link:"",style:"",rush:false,scheduled_date:"",scheduled_time:""});
          await refreshTickets();await refreshBookings();setPage("tickets");
        }catch(err){setNotice(err.message||"Impossible de créer la demande.");}
        finally{setBusy(false);}
      }

      async function openTicket(ticket){
        setActiveTicket(ticket);setPage("ticket-detail");
        const {data,error}=await supabase.from("ticket_messages").select("*").eq("ticket_id",ticket.id).order("created_at",{ascending:true});
        if(error){setMessages([]);setNotice("Messages : "+error.message);}else setMessages(data||[]);
      }
      async function sendMessage(e){
        e?.preventDefault();
        if(!messageText.trim()||!activeTicket)return;
        if(activeTicket.status==="Fermé"){setNotice("Ce ticket est fermé. Réouvre-le avant d’envoyer un message.");return;}
        const {error}=await supabase.from("ticket_messages").insert({ticket_id:activeTicket.id,sender_id:session.user.id,text:messageText.trim()});
        if(error){setNotice(error.message);return;}
        setMessageText("");
        await openTicket(activeTicket);
      }
      async function updateTicketStatus(ticket,nextStatus){
        if(!isTeam){setNotice("Seuls les monteurs et administrateurs peuvent modifier le statut.");return;}
        const {data,error}=await supabase.from("tickets").update({status:nextStatus}).eq("id",ticket.id).select("*").single();
        if(error){setNotice("Impossible de modifier le statut : "+error.message);return;}
        setTickets(prev=>prev.map(t=>t.id===ticket.id?data:t));
        setActiveTicket(data);
        setNotice(nextStatus==="Fermé"?"Ticket fermé.":"Ticket réouvert.");
      }
      async function saveSettings(e){
        e.preventDefault();if(!isAdmin)return;setBusy(true);setNotice("");
        try{
          const {error}=await supabase.from("settings").upsert({...settingsForm,id:1},{onConflict:"id"});
          if(error)throw error;
          setSettings(prev=>({...prev,...settingsForm}));setNotice("Paramètres enregistrés.");
        }catch(err){setNotice("Paramètres : "+err.message);}
        finally{setBusy(false);}
      }
      async function addPortfolio(e){
        e.preventDefault();if(!isAdmin)return;setBusy(true);setNotice("");
        try{
          const payload={title:newVideo.title,category:newVideo.category,video_url:newVideo.video_url,price_base:newVideo.price_base?Number(newVideo.price_base):null};
          if(newVideo.thumbnail_url)payload.thumbnail_url=newVideo.thumbnail_url;
          const {error}=await supabase.from("portfolio").insert(payload);
          if(error)throw error;
          setNewVideo({title:"",category:"Gaming",video_url:"",thumbnail_url:"",price_base:""});
          const {data}=await supabase.from("portfolio").select("*").order("created_at",{ascending:false});if(data)setPortfolio(data);
          setNotice("Vidéo ajoutée au portfolio.");
        }catch(err){setNotice("Portfolio : "+err.message+" (vérifie les colonnes disponibles dans ta table portfolio).");}
        finally{setBusy(false);}
      }
      async function deletePortfolio(item){
        if(!isAdmin||!confirm(`Supprimer « ${item.title} » du portfolio ?`))return;
        const {error}=await supabase.from("portfolio").delete().eq("id",item.id);
        if(error){setNotice(error.message);return;}
        setPortfolio(prev=>prev.filter(p=>p.id!==item.id));setNotice("Vidéo supprimée.");
      }

      const visibleTickets=useMemo(()=>tickets.filter(t=>isTeam||t.client_id===session?.user?.id),[tickets,isTeam,session]);
      const monthLabel=month.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
      const calendarDays=useMemo(()=>{
        const first=new Date(month.getFullYear(),month.getMonth(),1);
        const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
        return Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
      },[month]);

      function videoId(url){
        const match=String(url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
        return match?match[1]:null;
      }
      function VideoCard({item}){
        const id=videoId(item.video_url);
        return <article className="glass rounded-2xl overflow-hidden">
          <div className="aspect-video bg-black">
            {id?<iframe className="w-full h-full" src={`https://www.youtube-nocookie.com/embed/${id}`} title={item.title} loading="lazy" allowFullScreen></iframe>:
              item.thumbnail_url?<a href={item.video_url} target="_blank" rel="noreferrer"><img className="w-full h-full object-cover" src={item.thumbnail_url} alt={item.title}/></a>:
              <a href={item.video_url} target="_blank" rel="noreferrer" className="w-full h-full flex items-center justify-center text-5xl">▶</a>}
          </div>
          <div className="p-4 flex items-start justify-between gap-3"><div><div className="text-xs muted mb-1">{item.category||"Vidéo"}</div><h3 className="font-bold">{item.title}</h3>{item.price_base!=null&&<p className="muted text-sm mt-1">À partir de {money(item.price_base)}</p>}</div>{isAdmin&&<button className="btn btn-danger text-sm" onClick={()=>deletePortfolio(item)}>Supprimer</button>}</div>
        </article>;
      }

      if(!supabaseReady){
        return <div className="min-h-screen flex items-center justify-center p-5">
          <div className="glass max-w-xl w-full rounded-3xl p-7">
            <div className="text-sm font-bold mb-3" style={{color:"#a78bfa"}}>WAKZIL STUDIO</div>
            <h1 className="text-3xl font-black mb-3">Ton site est presque prêt.</h1>
            <p className="muted mb-5">Pour connecter la connexion, les tickets et le calendrier, colle les deux valeurs Supabase dans le début du fichier.</p>
            <ol className="list-decimal pl-5 space-y-2 muted">
              <li>Ouvre <b className="text-white">Supabase → Project Settings → API</b>.</li>
              <li>Copie l’URL du projet dans <code className="text-white">SUPABASE_URL</code>.</li>
              <li>Copie la clé <b className="text-white">publishable</b> (ou anon) dans <code className="text-white">SUPABASE_KEY</code>.</li>
              <li>Enregistre le fichier puis recharge la page.</li>
            </ol>
            <p className="text-sm mt-5 text-amber-200">N’utilise jamais la clé <code>service_role</code> dans un fichier HTML public.</p>
          </div>
        </div>;
      }

      return <div className="min-h-screen">
        <header className="sticky top-0 z-30 border-b border-white/10 backdrop-blur-xl bg-[#090b10]/90">
          <div className="max-w-7xl mx-auto px-4 md:px-6 py-3 flex items-center justify-between gap-3">
            <button onClick={()=>setPage("accueil")} className="flex items-center gap-3 text-left shrink-0">
              <div className="w-10 h-10 rounded-xl flex items-center justify-center font-black text-xl" style={{background:settings.theme_color}}>W</div>
              <div><div className="font-black tracking-wide">WAKZIL <span style={{color:settings.theme_color}}>STUDIO</span></div><div className="text-xs muted">Montage vidéo & création</div></div>
            </button>
            <nav className="flex items-center gap-1 overflow-x-auto">
              {[["accueil","Accueil"],["portfolio","Portfolio"],["commande","Commander"],...(session?[["tickets","Mes tickets"]]:[]),...(isTeam?[["calendrier","Calendrier"]]:[]),...(isAdmin?[["admin","Administration"]]:[])].map(([key,label])=><button key={key} onClick={()=>setPage(key)} className={`navlink ${page===key?"active":""}`}>{label}</button>)}
            </nav>
            <div className="hidden md:flex items-center gap-2 shrink-0">
              {session?<><span className="text-sm muted max-w-28 truncate">{profile?.display_name||session.user.email}</span><button className="btn btn-quiet text-sm" onClick={logout}>Déconnexion</button></>:<button className="btn btn-primary text-sm" onClick={()=>setPage("compte")}>Connexion</button>}
            </div>
          </div>
        </header>

        <main className="max-w-7xl mx-auto px-4 md:px-6 py-7">
          {notice&&<div className="mb-5 p-3 rounded-xl border border-white/10 bg-[#191b27] flex justify-between gap-3"><span className="text-sm">{notice}</span><button onClick={()=>setNotice("")} aria-label="Fermer">✕</button></div>}
          {loading&&<div className="py-16 text-center muted">Chargement de ton espace…</div>}

          {!loading&&page==="accueil"&&<section>
            <div className="hero-grid rounded-3xl p-7 md:p-14 border border-white/10 overflow-hidden">
              <div className="max-w-3xl">
                <span className="pill" style={{borderColor:settings.theme_color,color:"#ddd6fe"}}>WAKZIL STUDIO · POST-PRODUCTION</span>
                <h1 className="text-4xl md:text-6xl font-black leading-tight mt-5">Des vidéos qui <span style={{color:settings.theme_color}}>captent</span> l’attention.</h1>
                <p className="text-base md:text-lg muted mt-5 max-w-2xl">{settings.portfolio_description||"Du montage gaming aux formats courts, chaque vidéo est pensée pour raconter quelque chose."}</p>
                <div className="flex flex-wrap gap-3 mt-8"><button className="btn btn-primary" onClick={()=>setPage("commande")}>Demander un montage ↗</button><button className="btn btn-quiet" onClick={()=>setPage("portfolio")}>Voir le portfolio</button></div>
                <div className="grid grid-cols-3 gap-3 mt-10 max-w-xl"><div className="rounded-xl bg-black/20 p-3"><div className="text-xl md:text-2xl font-black">Sur mesure</div><div className="text-xs muted mt-1">Chaque projet</div></div><div className="rounded-xl bg-black/20 p-3"><div className="text-xl md:text-2xl font-black">Créatif</div><div className="text-xs muted mt-1">Style personnalisé</div></div><div className="rounded-xl bg-black/20 p-3"><div className="text-xl md:text-2xl font-black">Suivi</div><div className="text-xs muted mt-1">Via les tickets</div></div></div>
              </div>
            </div>
            <div className="flex items-end justify-between mt-10 mb-4 gap-3"><div><h2 className="text-2xl font-black">Projets récents</h2><p className="muted text-sm mt-1">Quelques réalisations du studio.</p></div><button className="btn btn-quiet" onClick={()=>setPage("portfolio")}>Tout voir →</button></div>
            {portfolio.length?<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{portfolio.slice(0,3).map(item=><VideoCard key={item.id} item={item}/>)}</div>:<div className="glass rounded-2xl p-7 muted">Le portfolio sera affiché ici dès que des vidéos auront été ajoutées dans Supabase.</div>}
          </section>}

          {!loading&&page==="portfolio"&&<section><div className="mb-6"><h1 className="text-3xl font-black">Portfolio</h1><p className="muted mt-2">Les montages et projets du studio.</p></div>{portfolio.length?<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{portfolio.map(item=><VideoCard key={item.id} item={item}/>)}</div>:<div className="glass rounded-2xl p-8 muted">Aucune vidéo pour le moment.</div>}</section>}

          {!loading&&page==="commande"&&<section className="max-w-3xl mx-auto"><div className="mb-6"><h1 className="text-3xl font-black">Demander un montage</h1><p className="muted mt-2">Décris ton projet et, si tu le souhaites, choisis une date et une heure de rendez-vous vidéo.</p></div>
            <form onSubmit={createOrder} className="glass rounded-2xl p-5 md:p-7 space-y-5">
              {!session&&<div className="rounded-xl border border-violet-400/30 bg-violet-500/10 p-3 text-sm">Tu dois être connecté pour envoyer une demande. <button type="button" className="underline font-bold" onClick={()=>setPage("compte")}>Se connecter</button></div>}
              <div><label className="text-sm font-semibold block mb-2">Nom du projet *</label><input className="field" required value={order.title} onChange={e=>setOrder({...order,title:e.target.value})} placeholder="Ex. Montage Rocket League"/></div>
              <div className="grid sm:grid-cols-2 gap-4"><div><label className="text-sm font-semibold block mb-2">Contact (Discord, e-mail…)</label><input className="field" value={order.contact} onChange={e=>setOrder({...order,contact:e.target.value})} placeholder="Ton moyen de contact"/></div><div><label className="text-sm font-semibold block mb-2">Style souhaité</label><select className="field" value={order.style} onChange={e=>setOrder({...order,style:e.target.value})}><option value="">Choisir un style</option><option>Gaming dynamique</option><option>Cinématique</option><option>Short / TikTok / Reels</option><option>Montage classique</option><option>Autre (préciser dans le brief)</option></select></div></div>
              <div><label className="text-sm font-semibold block mb-2">Lien des rushs / fichiers</label><input className="field" type="url" value={order.source_link} onChange={e=>setOrder({...order,source_link:e.target.value})} placeholder="https://…"/></div>
              <div><label className="text-sm font-semibold block mb-2">Description du projet *</label><textarea className="field min-h-32" required value={order.brief} onChange={e=>setOrder({...order,brief:e.target.value})} placeholder="Durée, références, musique, effets, consignes…"/></div>
              <label className="flex items-center gap-3 rounded-xl bg-black/20 p-4 cursor-pointer"><input type="checkbox" checked={order.rush} onChange={e=>setOrder({...order,rush:e.target.checked})}/><span><b>Montage prioritaire</b><span className="block text-sm muted">Supplément : {money(settings.rush_price)} · délai indicatif : {settings.rush_delivery_time||"à confirmer"}</span></span></label>
              <div className="rounded-xl border border-white/10 p-4"><h3 className="font-bold mb-1">Planifier une vidéo (facultatif)</h3><p className="text-sm muted mb-4">La date et l’heure seront visibles dans le calendrier de l’équipe.</p><div className="grid sm:grid-cols-2 gap-4"><div><label className="text-sm block mb-2">Date</label><input className="field" type="date" min={isoDay(new Date())} value={order.scheduled_date} onChange={e=>setOrder({...order,scheduled_date:e.target.value})}/></div><div><label className="text-sm block mb-2">Heure</label><input className="field" type="time" value={order.scheduled_time} onChange={e=>setOrder({...order,scheduled_time:e.target.value})}/></div></div></div>
              <div className="flex flex-wrap items-center justify-between gap-3 border-t border-white/10 pt-5"><div><div className="muted text-sm">Estimation indicative</div><div className="text-2xl font-black">{money((Number(settings.base_price)||0)+(order.rush?(Number(settings.rush_price)||0):0))}</div></div><button className="btn btn-primary" disabled={busy} type="submit">{busy?"Envoi…":"Envoyer la demande →"}</button></div>
            </form>
          </section>}

          {!loading&&page==="compte"&&<section className="max-w-md mx-auto"><div className="glass rounded-2xl p-6 md:p-8"><h1 className="text-3xl font-black">{authMode==="login"?"Content de te revoir":"Créer un compte"}</h1><p className="muted mt-2 mb-6">{authMode==="login"?"Connecte-toi pour suivre tes projets.":"Crée ton espace client pour commander un montage."}</p><form onSubmit={signIn} className="space-y-4">
            {authMode==="signup"&&<div><label className="text-sm block mb-2">Nom / pseudo</label><input className="field" required value={authForm.name} onChange={e=>setAuthForm({...authForm,name:e.target.value})} placeholder="Ton pseudo"/></div>}
            <div><label className="text-sm block mb-2">E-mail</label><input className="field" type="email" required value={authForm.email} onChange={e=>setAuthForm({...authForm,email:e.target.value})} placeholder="toi@exemple.fr"/></div>
            <div><label className="text-sm block mb-2">Mot de passe</label><input className="field" type="password" minLength="6" required value={authForm.password} onChange={e=>setAuthForm({...authForm,password:e.target.value})} placeholder="6 caractères minimum"/></div>
            <button className="btn btn-primary w-full" disabled={busy}>{busy?"Patiente…":authMode==="login"?"Se connecter":"Créer mon compte"}</button>
          </form><p className="text-sm muted mt-5 text-center">{authMode==="login"?"Pas encore de compte ?":"Tu as déjà un compte ?"} <button className="underline text-white" onClick={()=>setAuthMode(authMode==="login"?"signup":"login")}>{authMode==="login"?"Créer un compte":"Se connecter"}</button></p></div></section>}

          {!loading&&page==="tickets"&&<section><div className="flex flex-wrap justify-between items-end gap-3 mb-6"><div><h1 className="text-3xl font-black">{isTeam?"Tous les tickets":"Mes tickets"}</h1><p className="muted mt-2">Suis l’avancement de tes demandes et échange avec l’équipe.</p></div><button className="btn btn-primary" onClick={()=>setPage("commande")}>+ Nouvelle demande</button></div>
            {visibleTickets.length?<div className="grid md:grid-cols-2 gap-4">{visibleTickets.map(t=><button key={t.id} onClick={()=>openTicket(t)} className="glass rounded-2xl p-5 text-left hover:border-violet-400/50 transition"><div className="flex justify-between gap-3 items-start"><div><div className="font-bold text-lg">{t.title}</div><div className="text-sm muted mt-1">{t.client_name||"Client"} · {niceDate(t.created_at)}</div></div><span className="pill">{t.status||"En attente"}</span></div><div className="flex justify-between mt-5"><span className="muted text-sm">Ticket #{String(t.public_code||t.id).slice(0,8)}</span><b>{money(t.price)}</b></div></button>)}</div>:<div className="glass rounded-2xl p-8 muted">Aucun ticket pour le moment.</div>}
          </section>}

          {!loading&&page==="ticket-detail"&&activeTicket&&<section className="max-w-4xl mx-auto"><button className="navlink mb-4" onClick={()=>setPage("tickets")}>← Retour aux tickets</button><div className="glass rounded-2xl overflow-hidden"><div className="p-5 md:p-6 border-b border-white/10 flex flex-wrap items-start justify-between gap-4"><div><span className="pill">{activeTicket.status||"En attente"}</span><h1 className="text-2xl font-black mt-3">{activeTicket.title}</h1><p className="muted text-sm mt-1">{activeTicket.client_name} · Ticket #{String(activeTicket.public_code||activeTicket.id).slice(0,8)}</p></div><div className="flex flex-wrap gap-2">{activeTicket.status!=="Fermé"&&settings.paypal_link&&<a className="btn btn-primary" href={settings.paypal_link} target="_blank" rel="noreferrer">Payer {money(activeTicket.price)}</a>}{isTeam&&<button className={`btn ${activeTicket.status==="Fermé"?"btn-primary":"btn-danger"}`} onClick={()=>updateTicketStatus(activeTicket,activeTicket.status==="Fermé"?"En cours":"Fermé")}>{activeTicket.status==="Fermé"?"↻ Réouvrir le ticket":"✓ Fermer le ticket"}</button>}</div></div>
            <div className="p-5 md:p-6"><div className="grid sm:grid-cols-2 gap-3 mb-5"><div className="rounded-xl bg-black/20 p-3"><div className="text-xs muted">Budget estimé</div><div className="font-bold text-lg">{money(activeTicket.price)}</div></div><div className="rounded-xl bg-black/20 p-3"><div className="text-xs muted">Contact</div><div className="font-semibold break-words">{activeTicket.contact||"Non renseigné"}</div></div></div>{activeTicket.brief&&<div className="mb-6"><h3 className="font-bold mb-2">Brief du projet</h3><p className="muted whitespace-pre-wrap">{activeTicket.brief}</p></div>}{activeTicket.source_link&&<p className="mb-6"><a className="underline" href={activeTicket.source_link} target="_blank" rel="noreferrer">Ouvrir les fichiers du projet ↗</a></p>}
              <h2 className="font-bold text-xl mb-4">Conversation</h2><div className="space-y-3 mb-5">{messages.length?messages.map(m=><div key={m.id} className={`rounded-xl p-3 ${m.sender_id===session?.user?.id?"bg-violet-500/15 ml-4":"bg-black/25 mr-4"}`}><div className="text-xs muted mb-1">{m.sender_id===session?.user?.id?"Toi":"Équipe"} · {niceDate(m.created_at)}</div><p className="whitespace-pre-wrap break-words">{m.text}</p></div>):<p className="muted text-sm">Pas encore de message.</p>}</div>
              {activeTicket.status==="Fermé"?<div className="rounded-xl p-4 border border-amber-300/20 text-amber-100 bg-amber-500/10">Ce ticket est fermé. {isTeam?"Tu peux le réouvrir avec le bouton en haut.":"L’équipe doit le réouvrir pour continuer la conversation."}</div>:<form onSubmit={sendMessage} className="flex gap-2"><textarea className="field min-h-12" rows="2" value={messageText} onChange={e=>setMessageText(e.target.value)} placeholder="Écrire un message…" required/><button className="btn btn-primary self-end">Envoyer</button></form>}
            </div></div></section>}

          {!loading&&page==="calendrier"&&isTeam&&<section><div className="flex flex-wrap justify-between items-end gap-3 mb-6"><div><h1 className="text-3xl font-black">Calendrier de l’équipe</h1><p className="muted mt-2">Réservations et rendez-vous planifiés par les clients.</p></div><div className="flex gap-2"><button className="btn btn-quiet" onClick={()=>setMonth(new Date(month.getFullYear(),month.getMonth()-1,1))}>←</button><button className="btn btn-quiet" onClick={()=>setMonth(new Date())}>Aujourd’hui</button><button className="btn btn-quiet" onClick={()=>setMonth(new Date(month.getFullYear(),month.getMonth()+1,1))}>→</button></div></div>
            <div className="glass rounded-2xl p-3 md:p-5"><h2 className="text-xl font-bold capitalize mb-4">{monthLabel}</h2><div className="grid grid-cols-7 gap-1.5 mb-2">{["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(d=><div key={d} className="text-center muted text-xs font-bold py-2">{d}</div>)}</div><div className="grid grid-cols-7 gap-1.5">{calendarDays.map((d,i)=>{const dayBookings=bookings.filter(b=>b.scheduled_at&&isoDay(new Date(b.scheduled_at))===isoDay(d));return <div key={i} className={`calendar-cell ${d.getMonth()!==month.getMonth()?"other":""} ${isoDay(d)===isoDay(new Date())?"today":""}`}><div className="text-xs font-bold mb-1">{d.getDate()}</div><div className="space-y-1">{dayBookings.map(b=><div key={b.id} title={`${b.title} — ${b.client_name} — ${niceDate(b.scheduled_at)}`} className="rounded-md px-1 py-1 text-[10px] leading-tight break-words" style={{background:settings.theme_color}}>{new Date(b.scheduled_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})} {b.title}</div>)}</div></div>})}</div></div>
            <div className="mt-6"><h2 className="text-xl font-bold mb-3">Prochains rendez-vous</h2>{bookings.filter(b=>new Date(b.scheduled_at)>=new Date()).slice(0,10).length?<div className="space-y-2">{bookings.filter(b=>new Date(b.scheduled_at)>=new Date()).slice(0,10).map(b=><div key={b.id} className="glass rounded-xl p-4 flex flex-wrap justify-between gap-3"><div><b>{b.title}</b><div className="text-sm muted">{b.client_name} · {b.status||"À planifier"}</div>{b.notes&&<div className="text-sm muted mt-1 line-clamp-3">{b.notes}</div>}</div><div className="font-semibold">{niceDate(b.scheduled_at)}</div></div>)}</div>:<div className="glass rounded-xl p-5 muted">Aucun rendez-vous à venir.</div>}</div>
          </section>}

          {!loading&&page==="admin"&&isAdmin&&<section className="max-w-4xl mx-auto"><div className="mb-6"><h1 className="text-3xl font-black">Administration</h1><p className="muted mt-2">Gère l’apparence, les tarifs et le portfolio.</p></div>
            <form onSubmit={saveSettings} className="glass rounded-2xl p-5 md:p-6 mb-6"><h2 className="text-xl font-bold mb-4">Paramètres du site</h2><div className="grid sm:grid-cols-2 gap-4">
              <div><label className="text-sm block mb-2">Couleur principale</label><div className="flex gap-2"><input type="color" className="h-11 w-14 rounded-lg bg-transparent" value={settingsForm?.theme_color||settings.theme_color} onChange={e=>setSettingsForm({...settingsForm,theme_color:e.target.value})}/><input className="field" value={settingsForm?.theme_color||settings.theme_color} onChange={e=>setSettingsForm({...settingsForm,theme_color:e.target.value})}/></div></div>
              <div><label className="text-sm block mb-2">Lien de paiement PayPal</label><input className="field" type="url" value={settingsForm?.paypal_link||""} onChange={e=>setSettingsForm({...settingsForm,paypal_link:e.target.value})} placeholder="https://paypal.me/…"/></div>
              <div><label className="text-sm block mb-2">Tarif de base (€)</label><input className="field" type="number" min="0" value={settingsForm?.base_price??""} onChange={e=>setSettingsForm({...settingsForm,base_price:Number(e.target.value)})}/></div>
              <div><label className="text-sm block mb-2">Supplément prioritaire (€)</label><input className="field" type="number" min="0" value={settingsForm?.rush_price??""} onChange={e=>setSettingsForm({...settingsForm,rush_price:Number(e.target.value)})}/></div>
              <div><label className="text-sm block mb-2">Tarif miniature (€)</label><input className="field" type="number" min="0" value={settingsForm?.minia_price??""} onChange={e=>setSettingsForm({...settingsForm,minia_price:Number(e.target.value)})}/></div>
              <div><label className="text-sm block mb-2">Tarif sous-titres (€)</label><input className="field" type="number" min="0" value={settingsForm?.sous_titres_price??""} onChange={e=>setSettingsForm({...settingsForm,sous_titres_price:Number(e.target.value)})}/></div>
              <div><label className="text-sm block mb-2">Délai prioritaire</label><input className="field" value={settingsForm?.rush_delivery_time||""} onChange={e=>setSettingsForm({...settingsForm,rush_delivery_time:e.target.value})} placeholder="48 heures"/></div>
            </div><div className="mt-4"><label className="text-sm block mb-2">Description du portfolio</label><textarea className="field min-h-24" value={settingsForm?.portfolio_description||""} onChange={e=>setSettingsForm({...settingsForm,portfolio_description:e.target.value})}/></div><button className="btn btn-primary mt-5" disabled={busy}>Enregistrer les paramètres</button></form>
            <form onSubmit={addPortfolio} className="glass rounded-2xl p-5 md:p-6"><h2 className="text-xl font-bold mb-4">Ajouter une vidéo au portfolio</h2><div className="grid sm:grid-cols-2 gap-4"><div><label className="text-sm block mb-2">Titre *</label><input className="field" required value={newVideo.title} onChange={e=>setNewVideo({...newVideo,title:e.target.value})}/></div><div><label className="text-sm block mb-2">Catégorie</label><select className="field" value={newVideo.category} onChange={e=>setNewVideo({...newVideo,category:e.target.value})}><option>Gaming</option><option>Shorts</option><option>Montage vidéo</option><option>Miniature</option><option>Autre</option></select></div><div className="sm:col-span-2"><label className="text-sm block mb-2">Lien vidéo (YouTube ou autre) *</label><input className="field" required type="url" value={newVideo.video_url} onChange={e=>setNewVideo({...newVideo,video_url:e.target.value})} placeholder="https://…"/></div><div><label className="text-sm block mb-2">URL de miniature (facultatif)</label><input className="field" type="url" value={newVideo.thumbnail_url} onChange={e=>setNewVideo({...newVideo,thumbnail_url:e.target.value})}/></div><div><label className="text-sm block mb-2">Prix de départ (€)</label><input className="field" type="number" min="0" value={newVideo.price_base} onChange={e=>setNewVideo({...newVideo,price_base:e.target.value})}/></div></div><button className="btn btn-primary mt-5" disabled={busy}>Ajouter au portfolio</button><p className="text-xs muted mt-3">Si la table portfolio n’a pas de colonne thumbnail_url, laisse ce champ vide. Les colonnes existantes title, category, video_url et price_base sont utilisées.</p></form>
          </section>}

          {!loading&&page==="admin"&&!isAdmin&&<div className="glass rounded-2xl p-8 text-center"><h2 className="text-xl font-bold">Accès réservé</h2><p className="muted mt-2">Cette page est disponible uniquement pour les administrateurs.</p></div>}
          {!loading&&page==="calendrier"&&!isTeam&&<div className="glass rounded-2xl p-8 text-center"><h2 className="text-xl font-bold">Calendrier réservé à l’équipe</h2><p className="muted mt-2">Connecte-toi avec un compte admin ou monteur.</p></div>}
        </main>
        <footer className="border-t border-white/10 mt-14"><div className="max-w-7xl mx-auto px-4 md:px-6 py-7 flex flex-wrap justify-between gap-3 muted text-sm"><span>© {new Date().getFullYear()} Wakzil Studio</span><span>Montage vidéo · Créativité · Passion</span></div></footer>
      </div>;
    }

    const root=ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
